name: Tests
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic sample
        run: python -m governance_auditor scan --input examples/synthetic --output reports/demo --as-of 2026-11-04
      - name: Run offline review demonstration
        run: python run_review_demo.py
      - name: Run offline synthetic SharePoint / Entra reconciliation
        run: python run_reconciliation_demo.py
      - name: Run offline synthetic access change comparison
        run: python run_change_demo.py
      - name: Run offline governance review demonstration
        run: python run_governance_demo.py